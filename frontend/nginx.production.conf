server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /reset-password {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /reset-password.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
