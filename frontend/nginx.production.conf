server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /reset-password {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /reset-password.html =404;
    }

    location = /downloads/preco-bao.apk {
        alias /usr/share/nginx/html/downloads/preco-bao-1.0.1-internal.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="preco-bao-1.0.1-internal.apk"' always;
        add_header Cache-Control "no-store" always;
    }

    location = /downloads/preco-bao-1.0.1-internal.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="preco-bao-1.0.1-internal.apk"' always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
