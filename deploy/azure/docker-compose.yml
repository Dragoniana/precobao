services:
  api:
    build:
      context: ../../backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=${CADDY_API_IP:-172.29.240.2}
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?Set the managed Azure PostgreSQL DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set a new unique JWT_SECRET}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?Set exact Azure Static Web Apps HTTPS origins}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_REGISTER_PER_HOUR: ${RATE_LIMIT_REGISTER_PER_HOUR:-5}
      RATE_LIMIT_CATALOG_PER_MINUTE: ${RATE_LIMIT_CATALOG_PER_MINUTE:-120}
      IMAGE_REFERENCE_STORE_PATH: /app/data/image_references/references.json
    volumes:
      - image_references:/app/data/image_references
      - ${AZURE_PG_ROOT_CERT_PATH:?Set AZURE_PG_ROOT_CERT_PATH to the VM CA bundle}:/run/secrets/azure-postgres-root-ca.pem:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - api_edge

  offer-refresh:
    build:
      context: ../../backend
    command: ["python", "-m", "app.scrapers.offer_refresh_scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the managed Azure PostgreSQL DATABASE_URL}
      IMAGE_REFERENCE_STORE_PATH: /app/data/image_references/references.json
      OFFER_REFRESH_STATE_DIR: /app/data/offer_refresh
      OFFER_REFRESH_ENABLED: ${OFFER_REFRESH_ENABLED:-true}
      OFFER_REFRESH_INTERVAL_MINUTES: ${OFFER_REFRESH_INTERVAL_MINUTES:-30}
      OFFER_REFRESH_INDIANA_BATCH: ${OFFER_REFRESH_INDIANA_BATCH:-200}
      OFFER_REFRESH_ARAUJO_BATCH: ${OFFER_REFRESH_ARAUJO_BATCH:-20}
      OFFER_REFRESH_REQUEST_DELAY_SECONDS: ${OFFER_REFRESH_REQUEST_DELAY_SECONDS:-1}
      OFFER_IMAGE_REFRESH_INDIANA_BATCH: ${OFFER_IMAGE_REFRESH_INDIANA_BATCH:-150}
      OFFER_IMAGE_REFRESH_ARAUJO_BATCH: ${OFFER_IMAGE_REFRESH_ARAUJO_BATCH:-20}
      OFFER_IMAGE_REFRESH_PACHECO_BATCH: ${OFFER_IMAGE_REFRESH_PACHECO_BATCH:-100}
    volumes:
      - image_references:/app/data/image_references
      - offer_refresh_state:/app/data/offer_refresh
      - ${AZURE_PG_ROOT_CERT_PATH:?Set AZURE_PG_ROOT_CERT_PATH to the VM CA bundle}:/run/secrets/azure-postgres-root-ca.pem:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: 1.0
    mem_limit: 1g

  pacheco-scheduler:
    build:
      context: ../../backend
    command: ["python", "-m", "app.scrapers.pacheco_scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the managed Azure PostgreSQL DATABASE_URL}
      IMAGE_REFERENCE_STORE_PATH: /app/data/image_references/references.json
      PACHECO_STATE_DIR: /app/data/pacheco
      PACHECO_SCHEDULER_ENABLED: ${PACHECO_SCHEDULER_ENABLED:-true}
      PACHECO_INTERVAL_HOURS: ${PACHECO_INTERVAL_HOURS:-24}
      PACHECO_FAILURE_RETRY_MINUTES: ${PACHECO_FAILURE_RETRY_MINUTES:-60}
      PACHECO_REQUEST_DELAY_SECONDS: ${PACHECO_REQUEST_DELAY_SECONDS:-1}
    volumes:
      - image_references:/app/data/image_references
      - pacheco_state:/app/data/pacheco
      - ${AZURE_PG_ROOT_CERT_PATH:?Set AZURE_PG_ROOT_CERT_PATH to the VM CA bundle}:/run/secrets/azure-postgres-root-ca.pem:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: 1.0
    mem_limit: 1g

  caddy:
    image: caddy:2.10-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set the public API domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      api_edge:
        ipv4_address: ${CADDY_API_IP:-172.29.240.2}

networks:
  api_edge:
    ipam:
      config:
        - subnet: ${CADDY_API_SUBNET:-172.29.240.0/24}

volumes:
  image_references:
  offer_refresh_state:
  pacheco_state:
  caddy_data:
  caddy_config:
