name: Azure Static Web Apps (manual, disabled by default)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Set this repository variable to the literal string "true" only after
    # Azure setup and explicit release authorization are complete.
    if: ${{ github.ref == 'refs/heads/main' && vars.PRECOBAO_AZURE_STATIC_WEB_APPS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate public API URL
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          node --input-type=module <<'NODE'
          const value = process.env.EXPO_PUBLIC_API_URL ?? '';
          let url;
          try { url = new URL(value); } catch { throw new Error('Set EXPO_PUBLIC_API_URL to the public API URL.'); }
          if (url.protocol !== 'https:' || !url.hostname || ['localhost', '127.0.0.1'].includes(url.hostname)) {
            throw new Error('EXPO_PUBLIC_API_URL must be a public HTTPS URL.');
          }
          NODE

      - name: Export Expo Web
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: npm run export:web

      - name: Require deployment token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: test -n "$SWA_TOKEN"

      - name: Deploy static export
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          production_branch: main
